<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Soundlog · 声音里的线索</title><link rel="stylesheet" href="assets/app.css"><script src="assets/app.js" defer></script></head>
<body>
<div class="shell">
 <aside class="sidebar"><a class="brand" href="#home"><span class="brand-icon" aria-hidden="true">▥</span><span>soundlog<small>声音里的线索</small></span></a><div class="nav-caption">你的录音空间</div><nav aria-label="主要功能">
 <button data-page="home" class="nav-item"><span>◫</span>概览</button><button data-page="me" class="nav-item"><span>◎</span>我的表达</button><button data-page="voice" class="nav-item"><span>◉</span>我的声音</button><button data-page="days" class="nav-item"><span>◷</span>每日记录</button><button data-page="tasks" class="nav-item"><span>☑</span>事项线索</button><button data-page="ask" class="nav-item"><span>✳</span>证据问答</button><button data-page="knowledge" class="nav-item"><span>⌘</span>知识花园</button><button data-page="studio" class="nav-item"><span>✎</span>创作素材</button><button data-page="reviews" class="nav-item"><span>▤</span>跨天复盘</button><button data-page="pipeline" class="nav-item"><span>⇢</span>处理与连接</button>
 </nav><div class="side-footer"><span class="status-dot"></span>本机资料空间<p>原文有出处 · 推断有边界</p><button id="refresh" class="text-button">↻ 刷新资料</button></div></aside>
 <div class="workspace"><header class="topbar"><button id="menu" class="icon-button mobile-only" aria-label="展开导航">☰</button><div id="breadcrumb">工作台 / 概览</div><button class="search-trigger" id="open-search"><span>⌕</span> 搜索录音原文与内容 <kbd>⌘ K</kbd></button><button id="open-comparison" class="secondary">表述对照 <span id="comparison-count">0</span></button><div class="local-label"><span class="status-dot"></span>本机运行</div></header>
 <main id="main" tabindex="-1" aria-live="polite"><div class="empty">正在读取已交付资料…</div></main><footer class="page-footer">录音时间用于回查，历史说法不自动代表当前状态。</footer></div>
</div>
<dialog id="detail" class="detail-dialog"><header><h2 id="detail-title">内容详情</h2><button id="close-detail" class="icon-button" aria-label="关闭详情">×</button></header><div id="detail-body"></div></dialog>
<dialog id="search-dialog" class="search-dialog"><form id="search-form"><label for="search-input">检索你的录音资料</label><div class="search-row"><input id="search-input" type="search" placeholder="输入主题或关键词，多个词以空格分隔" autocomplete="off"><button class="primary">搜索</button><button type="button" id="close-search" class="icon-button" aria-label="关闭搜索">×</button></div><p class="muted">同时检索已整理内容和原始转写；关键词未命中不代表从未提及。</p></form><div id="search-results"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div>
</body></html>

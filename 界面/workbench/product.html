<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soundlog · 我的记录</title><link rel="stylesheet" href="assets/product.css"><script src="assets/product.js" defer></script></head>
<body><aside><a class="brand" href="#all">soundlog<span>把重要的事留下来</span></a><nav aria-label="功能导航"><button data-view="all">每日记录</button><button data-view="meeting">会议纪要</button><button data-view="conversation">交谈记录</button><button data-view="event">生活与事件</button><button data-view="actions">待办与开口项</button><div class="nav-separator"></div><button data-view="knowledge">学习与知识</button><button data-view="writing">创作素材</button><button data-view="reviews">跨天复盘</button><div class="nav-separator"></div><button data-view="history">处理历史</button></nav><a class="debug" href="debug/">调试后台 ↗</a></aside><div class="workspace"><header><span>我的声音记录</span><div class="header-actions"><span id="run-status" role="status"></span><div id="pipeline-progress" class="pipeline-progress" data-state="idle"><div class="progress-caption"><span id="pipeline-stage">等待开始</span><span id="pipeline-stage-count">0/6</span></div><div id="pipeline-progress-track" class="progress-track" role="progressbar" aria-label="整条处理管线进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="等待开始"><div id="pipeline-progress-fill" class="progress-fill"></div><div class="progress-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div><button id="start-run" class="start-run">开始处理录音</button><button id="agent-handoff" hidden>复制提示词（备用）</button><button id="open-settings">设置</button><button id="refresh" aria-label="刷新成果">↻ 刷新</button></div></header><main><div class="intro"><p class="eyebrow">SOUNDLOG JOURNAL</p><h1 id="title">每日记录</h1><p id="description">会议、交谈和生活里值得留下的事。</p></div><div id="filters"><label>日期 <select id="date"><option value="">全部日期</option></select></label><input id="search" type="search" aria-label="搜索成果" placeholder="搜索主题或内容"></div><section id="content" aria-live="polite">正在打开记录…</section></main></div><dialog id="settings-dialog"><form id="sources-form"><div class="settings-title"><h2>录音来源</h2><button type="button" id="close-settings" aria-label="关闭设置">×</button></div><label class="memo-option"><input id="source-memos" type="checkbox"> 导入当天的语音备忘录</label><p class="quiet">只读取本机已下载、已结束的录音；不可访问时自动跳过。</p><label for="source-directories">外部录音目录</label><textarea id="source-directories" rows="5" placeholder="每行一个完整目录，例如 /Volumes/录音笔/RECORD"></textarea><p class="quiet">支持多个目录及子目录。未连接时跳过；按录制时间命名，重复文件不再导入。</p><p id="settings-status" role="status"></p><div class="settings-buttons"><button type="submit" class="start-run">保存设置</button></div></form></dialog><dialog id="agent-dialog" aria-labelledby="agent-dialog-title">
 <div class="settings-title"><h2 id="agent-dialog-title">交给 Agent 整理</h2><button type="button" id="close-agent-dialog" aria-label="关闭">×</button></div>
 <p>复制提示词，粘贴到你选的 Agent 对话里发送。该 Agent 需要能访问本机 Soundlog 项目。</p>
 <label for="agent-prompt">续跑提示词</label>
 <textarea id="agent-prompt" rows="9" readonly></textarea>
 <p id="agent-copy-status" role="status"></p>
 <div class="settings-buttons"><button type="button" id="copy-agent-prompt">复制提示词</button></div>
</dialog></body></html>
